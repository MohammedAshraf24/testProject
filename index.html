<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="java_script.js"></script>
    <nav>>
        <a href="index.html" class="active">Registration Form</a>
        <a href="data.html">Data Table</a>
    </nav>

    <div class="container">
        <h2>Register</h2>
        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <small class="error-msg" id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
                <small class="error-msg" id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters">
                <small class="error-msg" id="passwordError"></small>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter password">
                <small class="error-msg" id="confirmPasswordError"></small>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" placeholder="Must be a valid age">
                <small class="error-msg" id="ageError"></small>
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>

</html>
